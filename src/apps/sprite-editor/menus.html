<!-- Sprite Editor menus. shell/menu-bar.js parses this fragment and detaches it
     while another app is front, which also removes its shortcuts.
     apps/sprite-editor/index.js addresses items by data-menu and value, not id. -->
<vf-menu data-menu="file" label="File">
  <!-- ⌃N: the browser takes ⌘N before the page sees it. -->
  <vf-menu-item value="new" shortcut="⌃N">New…</vf-menu-item>
  <vf-separator></vf-separator>
  <!-- ⌃W: the browser takes ⌘W, and ⌥W types ∑ on a Mac. -->
  <vf-menu-item value="close" shortcut="⌃W">Close</vf-menu-item>
  <vf-menu-item value="save" shortcut="⌘S">Save</vf-menu-item>
  <vf-menu-item value="duplicate" shortcut="⌘D">Duplicate</vf-menu-item>
  <vf-menu-item value="rename">Rename…</vf-menu-item>
  <vf-separator></vf-separator>
  <!-- Download saves the document PNG unchanged, with no dialog. -->
  <vf-menu-item value="download" shortcut="⇧⌘E">Download</vf-menu-item>
  <vf-menu-item value="export-model">Export 3D Model…</vf-menu-item>
  <vf-menu-item value="export-atlas">Export Sprite Atlas…</vf-menu-item>
  <vf-separator></vf-separator>
  <!-- Quit closes every open document, asking about each unsaved one.
       ⌃Q: the browser takes ⌘Q. -->
  <vf-menu-item value="quit" shortcut="⌃Q">Quit</vf-menu-item>
</vf-menu>
<vf-menu data-menu="edit" label="Edit">
  <!-- Disabled until the active document's history has a step. A disabled item
       has no shortcut, so ⌘Z reaches a focused field's native undo. -->
  <vf-menu-item value="undo" shortcut="⌘Z" disabled>Undo</vf-menu-item>
  <vf-menu-item value="redo" shortcut="⇧⌘Z" disabled>Redo</vf-menu-item>
  <vf-separator></vf-separator>
  <!-- Copy, Paste and Select All act on the active window's selection. index.js
       disables all three during a drag and while a text control has focus, so
       ⌘C, ⌘V and ⌘A reach the field, and Copy with no selection. Paste reads
       the system clipboard at each pick. -->
  <vf-menu-item value="copy" shortcut="⌘C" disabled>Copy</vf-menu-item>
  <vf-menu-item value="paste" shortcut="⌘V">Paste</vf-menu-item>
  <vf-menu-item value="select-all" shortcut="⌘A">Select All</vf-menu-item>
  <vf-separator></vf-separator>
  <vf-menu-item value="pick-color" shortcut="⌘K">Pick Color…</vf-menu-item>
  <!-- Retiles the active document as an undoable edit, applied on OK only. -->
  <vf-menu-item value="tile-size">Tile Size…</vf-menu-item>
</vf-menu>
<vf-menu data-menu="view" label="View">
  <!-- No Fullscreen item: the Fullscreen API takes Esc away from the page. -->
  <!-- index.js syncArrange sets the value: "arrange" while a window is off its
       placement, "zoom" once all are arranged. The label does not change.
       data-item addresses the item because its value changes. -->
  <vf-menu-item data-item="arrange" value="arrange" shortcut="⌘J"
    >Arrange Windows</vf-menu-item
  >
  <vf-separator></vf-separator>
  <!-- Toggles prefs.showRing (windows.html #win-ring). Off at every load. -->
  <vf-menu-item value="ring">3D Sprite Atlas</vf-menu-item>
  <!-- index.js syncWindows appends a separator and one item per open document
       window here, in creation order, with value window:<key>. -->
</vf-menu>
<!-- New, Delete and each move are one undo step, and so is a rename. index.js
     syncLayers greys New Layer at LAYER_MAX, Delete Layer with one layer, and
     Move Layer Up and Down on the first and last layers. Up is toward Layer 1. -->
<vf-menu data-menu="layer" label="Layer">
  <vf-menu-item value="layer-new">New Layer</vf-menu-item>
  <vf-menu-item value="layer-delete">Delete Layer</vf-menu-item>
  <vf-menu-item value="layer-rename">Rename Layer…</vf-menu-item>
  <vf-separator></vf-separator>
  <vf-menu-item value="layer-up">Move Layer Up</vf-menu-item>
  <vf-menu-item value="layer-down">Move Layer Down</vf-menu-item>
  <vf-separator></vf-separator>
  <!-- index.js syncLayers appends one item per layer of the active document
       here, in block order, with value layer:<i>, the edited one checked. Their
       digit shortcuts are display-only. src/shortcuts.js handles the keys. -->
</vf-menu>
<!-- Bare-letter shortcuts are display-only in the kit. src/shortcuts.js handles
     the keys. -->
<vf-menu data-menu="tools" label="Tools">
  <vf-menu-item value="tool-select" shortcut="S">Selection</vf-menu-item>
  <vf-menu-item value="tool-pencil" shortcut="B" checked>Pencil</vf-menu-item>
  <vf-menu-item value="tool-rect" shortcut="R">Rectangle</vf-menu-item>
  <vf-menu-item value="tool-fill" shortcut="G">Fill</vf-menu-item>
  <vf-menu-item value="tool-eraser" shortcut="E">Eraser</vf-menu-item>
  <vf-menu-item value="tool-eyedropper" shortcut="I">Eyedropper</vf-menu-item>
</vf-menu>
