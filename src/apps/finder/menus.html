<!-- Finder menus. shell/menu-bar.js parses this fragment; apps/finder/index.js
     addresses items by data-menu and value, not id. The boot disabled states
     match a fresh desktop. -->
<vf-menu data-menu="file" label="File">
  <!-- Open acts on the icon selection, the route a double-click or a tap pair
       takes. Disabled with nothing selected. -->
  <vf-menu-item value="open" shortcut="⌘O" disabled>Open</vf-menu-item>
  <!-- ⌃N: the browser takes ⌘N before the page sees it. -->
  <vf-menu-item value="new" shortcut="⌃N">New Sprite</vf-menu-item>
  <vf-menu-item value="new-folder">New Folder</vf-menu-item>
  <vf-separator></vf-separator>
  <!-- ⌃W: the browser takes ⌘W, and ⌥W types ∑ on a Mac. -->
  <vf-menu-item value="close" shortcut="⌃W" disabled>Close</vf-menu-item>
</vf-menu>
<vf-menu data-menu="edit" label="Edit">
  <!-- Disabled while a text field has focus, so the field keeps native ⌘C/⌘V/⌘A. -->
  <vf-menu-item value="copy" shortcut="⌘C" disabled>Copy</vf-menu-item>
  <vf-menu-item value="paste" shortcut="⌘V">Paste</vf-menu-item>
  <vf-menu-item value="select-all" shortcut="⌘A">Select All</vf-menu-item>
</vf-menu>
<vf-menu data-menu="view" label="View">
  <vf-menu-item value="arrange" shortcut="⌘J" disabled>Arrange Windows</vf-menu-item>
</vf-menu>
<vf-menu data-menu="special" label="Special">
  <!-- syncGate sets the label: "Clean Up Window" or "Clean Up Desktop". -->
  <vf-menu-item value="clean-up">Clean Up Desktop</vf-menu-item>
  <vf-menu-item value="empty-trash" disabled>Empty Trash…</vf-menu-item>
  <vf-separator></vf-separator>
  <vf-menu-item value="restore-defaults" disabled>Restore Default Files</vf-menu-item>
  <vf-separator></vf-separator>
  <vf-menu-item value="back-up" disabled>Back Up All Files…</vf-menu-item>
  <vf-menu-item value="restore-backup" disabled>Restore from Backup…</vf-menu-item>
</vf-menu>
