name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy-pages needs to write a Pages deployment and mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push queues behind an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The gates. A failure here or in the build stops the deploy.
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck

      # Enables Pages with Actions as the source on the first run. The base path
      # it reports is unused: vite.config.js builds with relative URLs.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The About box date is HEAD's commit date, which the shallow checkout has.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
