<!-- Sprite Editor windows, parsed by windows.js at init. The four windoids are
     appended hidden. The document window is a template cloned per open
     document. Every window must be a direct child of the desktop: the kit's
     stacking manager sees only direct vf-window children. -->
<!-- Utility windoids -->
<!-- Windoid geometry comes from layout.js. Only the Tools palette's size is
     authored here. windows.js sets closable=false on every windoid but the 3D
     Sprite Atlas. A windoid bar shows no title, so the heading only names the
     window for assistive tech. -->
<!-- Each windoid's controls go in slot="header". header-height includes the
     header's 1px rule and matches layout.js (STAGE_STRIP, SPRITE_STRIP,
     RING_STRIP). -->
<!-- Full Sprite View: fixed size, set by windows.js from layout.js (SPRITE_WIDTH,
     spriteHeightFor). -->
<vf-window
  id="win-sprite"
  variant="utility"
  heading="Full Sprite View"
  movable
  header-height="62"
>
  <sm-atlas-controls slot="header"></sm-atlas-controls>
  <!-- No status slot, so the kit draws no bottom bar. pattern paints behind each
       tile so transparent pixels show against it. -->
  <sm-atlas-view pattern="gray-12"></sm-atlas-view>
</vf-window>

<!-- 3D View: the scene renders with a transparent clear over the container's
     pattern. main.js builds the scene on #viewport after this window is
     appended. -->
<vf-window
  id="win-stage"
  variant="utility"
  heading="3D View"
  movable
  resizable
  header-height="24"
>
  <sm-stage-controls slot="header"></sm-stage-controls>
  <vf-container id="stage-well" fill-width fill-height pattern="gray-12">
    <canvas id="viewport"></canvas>
  </vf-container>
  <sm-status-line kind="build" slot="status"></sm-status-line>
</vf-window>

<!-- 3D Sprite Atlas: orthographic renders of the active document's model, one
     tile-size cell per yaw step. The empty status slot leaves the rail's corner
     cell for the grow box. windows.js sets the size rect, since the height follows
     the tile size. sm-ring-view.js paints the body's paper with a vf-container,
     since vf-window has no body pattern. -->
<vf-window
  id="win-ring"
  variant="utility"
  heading="3D Sprite Atlas"
  movable
  resizable
  scrollbars="horizontal"
  header-height="63"
>
  <sm-ring-controls slot="header"></sm-ring-controls>
  <sm-ring-view></sm-ring-view>
</vf-window>

<!-- Tools palette. Its size matches TOOLS_BOX in layout.js. Last in the markup,
     so it is on top of the other windoids. -->
<vf-window
  id="win-tools"
  variant="utility"
  heading="Tools"
  movable
  width="24"
  height="133"
>
  <sm-tools-panel></sm-tools-panel>
</vf-window>

<!-- Document window template -->
<template id="tpl-document-window">
  <vf-window heading="untitled" movable resizable zoomable>
    <sm-editor></sm-editor>
    <sm-status-line kind="tile" slot="status"></sm-status-line>
  </vf-window>
</template>
