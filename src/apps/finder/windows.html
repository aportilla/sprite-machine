<!-- Finder folder window template. windows.js clones it per open folder. -->
<!-- header-height and the count line's height match layout.js FOLDER_STRIP and
     FOLDER_COUNT_LINE. pattern="white" works around a bare vf-container painting
     the desktop pattern. The field sits at
     top/left 0 so its coordinates match placementAt(). 320 × 223 fits three
     lattice columns and two rows of icons. -->
<template id="tpl-folder-window">
  <vf-window
    heading="untitled folder"
    movable
    resizable
    scrollbars="both"
    header-height="20"
    width="320"
    height="223"
  >
    <vf-container slot="header" fill-width height="18" pattern="white" rule="bottom">
      <vf-label face="body" class="folder-count" left="8" top="2"></vf-label>
    </vf-container>
    <vf-icon-field top="0" left="0"></vf-icon-field>
  </vf-window>
</template>
