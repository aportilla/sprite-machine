<!-- Sprite Editor windows, copied by windows.js: each windoid once at init,
     appended hidden, and a document window per open document. -->
<!-- Utility windoids -->
<!-- Windoid geometry comes from layout.js. Only the Tools palette's size is
     authored here. The 3D Sprite Atlas alone has a close box. A windoid bar
     shows no title, so the heading only names the window for assistive
     tech. -->
<!-- Each windoid's controls go in slot="header". header-height includes the
     header's 1px rule and matches layout.js (STAGE_STRIP, SPRITE_STRIP,
     RING_STRIP). -->
<!-- Full Sprite View: fixed size, set by windows.js from layout.js (SPRITE_WIDTH,
     spriteHeightFor). -->
<vf-window
  data-window="sprite"
  variant="utility"
  heading="Full Sprite View"
  movable
  outline-drag
  header-height="62"
>
  <sm-atlas-controls slot="header"></sm-atlas-controls>
  <!-- No status slot, so the kit draws no bottom bar. pattern paints behind each
       tile so transparent pixels show against it. -->
  <sm-atlas-view pattern="gray-12"></sm-atlas-view>
</vf-window>

<!-- 3D View: the scene renders with a transparent clear over the container's
     pattern. main.js builds the scene on #viewport after this window is
     appended. -->
<vf-window
  data-window="stage"
  variant="utility"
  heading="3D View"
  movable
  outline-drag
  resizable
  header-height="24"
>
  <sm-stage-controls slot="header"></sm-stage-controls>
  <vf-container id="stage-well" fill-width fill-height pattern="gray-12">
    <!-- The canvas is sized in whole texels by scene/stage.js, so the well's
         box is measured here rather than on the canvas. -->
    <div id="stage-fit"><canvas id="viewport"></canvas></div>
  </vf-container>
  <sm-status-line kind="build" slot="status"></sm-status-line>
</vf-window>

<!-- 3D Sprite Atlas: orthographic renders of the active document's model, one
     tile-size cell per yaw step. The empty status slot leaves the rail's corner
     cell for the grow box. windows.js sets the size rect, since the height follows
     the tile size, and the pattern, the strip's paper setting. -->
<vf-window
  data-window="ring"
  variant="utility"
  heading="3D Sprite Atlas"
  closable
  movable
  outline-drag
  resizable
  scrollbars="horizontal"
  header-height="63"
>
  <sm-ring-controls slot="header"></sm-ring-controls>
  <sm-ring-view></sm-ring-view>
</vf-window>

<!-- Color Palette: the active document's colors, a grid of square swatches with
     as many columns as the width fits. The grow box sits in the status strip.
     windows.js sets the size rect. -->
<vf-window
  data-window="palette"
  variant="utility"
  heading="Color Palette"
  movable
  outline-drag
  resizable
  scrollbars="vertical"
>
  <sm-palette-view></sm-palette-view>
  <!-- windows.js writes the swatch count. -->
  <vf-label slot="status"></vf-label>
</vf-window>

<!-- Tools palette. Its size matches TOOLS_BOX in layout.js. -->
<vf-window
  data-window="tools"
  variant="utility"
  heading="Tools"
  movable
  outline-drag
  width="70"
  height="53"
>
  <sm-tools-panel></sm-tools-panel>
</vf-window>

<!-- Document window -->
<vf-window
  data-window="document"
  heading="untitled"
  closable
  movable
  outline-drag
  resizable
  zoomable
>
  <sm-editor></sm-editor>
  <sm-status-line kind="tile" slot="status"></sm-status-line>
</vf-window>
